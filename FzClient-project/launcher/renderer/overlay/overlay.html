<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' fzshot:; media-src fzshot:; style-src 'self'; script-src 'self'">
<title>FzClient Overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div class="veil" id="veil"></div>
<div class="bar" id="bar">
  <button data-p="perf" title="パフォーマンス"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8"/><path d="M3 21h18"/></svg></button>
  <button data-p="rec" title="録画"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" class="fill"/></svg></button>
  <button data-p="gallery" title="ギャラリー"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
  <button data-p="quick" title="クイック設定"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>

<div class="col left">
  <section class="panel" id="perf">
    <h2>パフォーマンス</h2>
    <div class="tiles" id="tiles"></div>
    <div class="graph-h"><span>フレーム時間</span><b id="ms"></b></div>
    <canvas id="graph" width="560" height="120"></canvas>
    <p class="note" id="perfNote">FzClient と接続すると FPS などが出ます</p>
  </section>

  <section class="panel" id="rec">
    <h2>録画<span class="enc" id="enc"></span></h2>
    <div id="recReady">
      <div class="row2">
        <button class="btn" id="recBtn">● 録画開始</button>
        <button class="btn" id="saveBtn">直前を保存</button>
      </div>
      <div class="item" id="replayRow"><span id="replayText"></span><button class="sw" id="replaySw"></button></div>
      <div class="seg" id="secs"></div>
      <p class="status" id="recStatus"></p>
      <div id="keyBox">
        <div class="sub-h">キー</div>
        <div id="keys"></div>
        <p class="note small" id="keyHint">ボタンを押してから、使いたいキーかマウスのボタンを押してください</p>
      </div>
      <button class="link" id="folderBtn">録画フォルダを開く</button>
    </div>
    <p class="note" id="recNone">ランチャーの「設定」→「録画」で準備すると使えます（次の起動から）</p>
  </section>
</div>

<div class="col right">
  <section class="panel" id="quick">
    <h2>クイック設定</h2>
    <div id="switches"></div>
    <button class="btn wide" id="menuBtn">すべての設定を開く</button>
  </section>
</div>

<section class="panel gallery" id="gallery">
  <h2>ギャラリー<span class="enc"><button class="link" id="galFolder">フォルダを開く</button></span></h2>
  <div class="strip" id="strip"></div>
  <p class="note" id="galEmpty">まだスクリーンショットもクリップもありません</p>
</section>
<div class="ovview" id="ovView">
  <button class="vnav prev" id="ovPrev">‹</button>
  <figure><img id="ovImg" alt=""><video id="ovVid" controls></video><figcaption id="ovCap"></figcaption></figure>
  <button class="vnav next" id="ovNext">›</button>
  <div class="vbar"><button class="btn" id="ovReveal">フォルダで表示</button><button class="btn" id="ovClose">閉じる</button></div>
</div>
<div class="hint">Alt+X / Esc で閉じる</div>
<script src="../i18n.js"></script>
<script src="overlay.js"></script>
</body>
</html>
