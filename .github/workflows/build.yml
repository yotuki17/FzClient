name: Build mod
on:
  push:
    branches: [main]
    paths: ['FzClient-project/mod/**']
  pull_request:
    paths: ['FzClient-project/mod/**']

jobs:
  gradle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FzClient-project/mod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.1.1

      - name: Setup Java
        uses: actions/setup-java@v4.0.0
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        # gradle.properties points org.gradle.java.home at a local Windows JDK; override it on CI
        run: ./gradlew build "-Dorg.gradle.java.home=$JAVA_HOME"

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4.3.0
        with:
          name: mod-jar
          path: FzClient-project/mod/build/libs/*.jar
